<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0f14" />
		<meta name="description" content="FlashRoute AI gateway and chat console" />
		<title>FlashRoute · AI Gateway</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1720'/%3E%3Cpath d='M16 18h32L36 34h12L24 52l7-14H20l8-8H16z' fill='%2334d399'/%3E%3C/svg%3E" />
		<script>
			(() => {
				const mode = localStorage.getItem('flashroute.theme') || 'system';
				const resolved = mode === 'system'
					? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: mode;
				document.documentElement.dataset.theme = resolved;
				const accents = ['green', 'blue', 'violet', 'amber', 'rose'];
				const accent = localStorage.getItem('flashroute.accent');
				document.documentElement.dataset.accent = accents.includes(accent) ? accent : 'green';
				document.documentElement.style.colorScheme = resolved;
				const meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute('content', resolved === 'dark' ? '#070b10' : '#f4f7fb');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
